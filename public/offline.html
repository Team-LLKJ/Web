<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>LIT · 오프라인</title>
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1c1c1e;
        background: #f6faff;
        text-align: center;
      }
      img { width: 120px; height: auto; margin-bottom: 20px; }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0 0 20px; color: #636366; line-height: 1.5; }
      button {
        min-height: 44px;
        padding: 0 22px;
        border: 0;
        border-radius: 10px;
        background: #007bff;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/lit-logo.png" alt="LIT" />
      <h1>인터넷에 연결되어 있지 않아요</h1>
      <p>평가는 인터넷 연결이 필요해요.<br />연결을 확인한 뒤 다시 시도해주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
