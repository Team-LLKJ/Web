    <script>
      (() => {
        const getLoadingLayout = function getLoadingLayout(pathname) {
          const path = pathname.replace(/\/+$/, "");
          if (/^\/teacher(?:\/(?:folders|evaluations))?$/.test(path))
            return "list";
          if (/^\/teacher\/folders\/[^/]+\/edit$/.test(path))
            return "assessment-edit";
          if (/^\/teacher\/evaluations\/[^/]+\/edit$/.test(path)) return "edit";
          if (/^\/teacher\/(?:folders|evaluations)\/new$/.test(path))
            return "form";
          if (/^\/teacher\/evaluations\/[^/]+\/results$/.test(path))
            return "results";
          if (/^\/teacher\/grading(?:\/[^/]+)?$/.test(path)) return "grading";
          if (
            /^\/teacher\/folders\/[^/]+\/classes\/[^/]+$/.test(path) ||
            /^\/teacher\/evaluations\/[^/]+$/.test(path)
          )
            return "lobby";
          if (/^\/teacher\/folders\/[^/]+$/.test(path)) return "folder";
          return "neutral";
        };
        const layout = getLoadingLayout(location.pathname);
        const template = document.getElementById("loading-" + layout);
        if (template)
          document
            .getElementById("root")
            .replaceChildren(template.content.cloneNode(true));
        if (layout === "folder") {
          try {
            const folderId = decodeURIComponent(
              location.pathname.split("/").filter(Boolean)[2] || "",
            );
            const shared = JSON.parse(
              localStorage.getItem("lit:shared-folder-ids") || "[]",
            );
            if (shared.map(String).includes(folderId))
              document
                .querySelectorAll("#root .folder-skeleton-delete")
                .forEach((node) => node.remove());
          } catch (error) {}
        }
        if (
          layout === "list" &&
          new URLSearchParams(location.search).get("tab") === "shared"
        ) {
          const tabs = document.querySelectorAll(
            "#root .segment-tabs.is-static button",
          );
          tabs.forEach((button, index) =>
            button.classList.toggle("active", index === 1),
          );
        }
      })();
    </script>
